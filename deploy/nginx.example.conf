# Tamamdır — nginx örnek yapılandırması (domain deploy)
# dist klasörlerini sunucuya kopyaladıktan sonra path'leri güncelleyin.

server {
    listen 80;
    server_name tamamdir.com www.tamamdir.com;

    # Website (tanıtım)
    location / {
        root /var/www/tamamdir/website;
        try_files $uri $uri/ /index.html;
    }

    # Web uygulaması
    location /app/ {
        alias /var/www/tamamdir/web-app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Mobil uygulama
    location /mobile/ {
        alias /var/www/tamamdir/mobile-app/;
        try_files $uri $uri/ /mobile/index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
